<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カントー151 音声クイズ</title>
<meta name="description" content="第1世代ポケモン151匹を声で答えるクイズ。マイクが常時聞き取って、言えたぶんだけ図鑑が埋まっていきます。">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>カントー151 <small>音声クイズ</small></h1>
    <p class="tagline">マイクは出しっぱなし。言うだけで埋まります。</p>
  </div>
  <div class="stats">
    <div class="stat">
      <span class="stat-value"><b id="count">0</b><i>/151</i></span>
      <span class="stat-label">そろった</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="timer">00:00</span>
      <span class="stat-label">タイム</span>
    </div>
  </div>
</header>

<div class="sticky-bar">
<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="151" aria-valuenow="0" id="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<section class="mic-panel">
  <button id="micBtn" class="mic-btn" type="button" aria-pressed="false">
    <span class="mic-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </span>
    <span class="mic-label" id="micBtnLabel">スタート</span>
  </button>

  <div class="mic-readout">
    <div class="mic-status" id="micStatus"><span class="dot"></span><span id="micStatusText">マイクは止まっています</span></div>
    <div class="interim" id="interim" aria-live="polite"></div>
  </div>
</section>
</div>

<div id="notice" class="notice" hidden></div>

<section class="controls">
  <form id="manualForm" class="manual" autocomplete="off">
    <input id="manualInput" type="text" placeholder="うまく聞き取れないときはここに入力（例: ゼニガメ）" aria-label="手入力で答える">
    <button type="submit">答える</button>
  </form>
  <div class="btn-row">
    <button type="button" id="revealBtn" class="ghost">答えを表示</button>
    <button type="button" id="resetBtn" class="ghost danger">リセット</button>
    <label class="toggle"><input type="checkbox" id="soundToggle" checked><span>効果音</span></label>
  </div>
  <p class="hint">埋まったマスをタップすると取り消せます（誤認識したとき用）。ニドラン♀♂は「ニドラン」を2回。</p>
</section>

<main>
  <div class="grid" id="grid"></div>
</main>

<section class="log-panel">
  <details id="logDetails">
    <summary>聞き取りログ <span class="log-hint">（何と認識されたか確認できます）</span></summary>
    <ul class="log-list" id="logList"></ul>
  </details>
</section>

<footer class="foot">
  <p>音声認識は Chrome / Edge の Web Speech API を使っています。Safari・Firefox では手入力でも遊べます。</p>
  <p>ポケモン名データ出典: <a href="https://github.com/PokeAPI/pokeapi" rel="noopener">PokeAPI</a> / 画像: <a href="https://github.com/PokeAPI/sprites" rel="noopener">PokeAPI sprites</a></p>
</footer>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="data.js"></script>
<script src="matcher.js"></script>
<script src="app.js"></script>
</body>
</html>
